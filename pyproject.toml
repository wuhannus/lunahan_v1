[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunahan-v1"
version = "1.0.0"
description = "lunahan_v1 — A RISC-V RV32IMC Core designed with XiangShan methodology + pyCircuit agile flow (Python → MLIR → Verilog → GDS)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "lunahan_v1 Contributors" }
]
requires-python = ">=3.10"
keywords = ["riscv", "rv32imc", "pycircuit", "mlir", "asic", "gds", "sky130"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
lunahan-build = "scripts.setup:main"
