<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>lunahan_v1 — Architecture Diagrams</title>
<style>
  :root { --bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;
    --accent:#58a6ff;--green:#3fb950;--yellow:#d2991d;--red:#f85149;--purple:#a371f7 }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;line-height:1.6;padding:2rem}
  .container{max-width:1100px;margin:0 auto}
  h1{font-size:1.6rem;margin-bottom:.5rem}
  h2{font-size:1.2rem;margin:2rem 0 1rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
  h3{font-size:1rem;margin:1rem 0 .5rem}
  .footer{color:var(--muted);font-size:.8rem;margin-top:3rem;text-align:center}
  svg{display:block;margin:1rem 0;max-width:100%}
</style>
</head>
<body>
<div class="container">
<h1>lunahan_v1 — Architecture &amp; Design Flow Diagrams</h1>

<h2>1. Core Microarchitecture Diagram</h2>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" style="background:#0d1117;border:1px solid #30363d;border-radius:8px">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/></marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3fb950"/></marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f85149"/></marker>
  </defs>

  <!-- Pipeline stages -->
  <rect x="30" y="50" width="160" height="180" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="110" y="75" fill="#58a6ff" text-anchor="middle" font-weight="bold" font-size="14">IF — Instruction Fetch</text>
  <text x="110" y="95" fill="#8b949e" text-anchor="middle" font-size="10">PC + BTB + ICache (4KB)</text>
  <line x1="50" y1="105" x2="170" y2="105" stroke="#30363d"/>
  <text x="55" y="120" fill="#c9d1d9" font-size="9">PC Register</text>
  <text x="55" y="135" fill="#c9d1d9" font-size="9">BTB (64e, 2-bit Bimodal)</text>
  <text x="55" y="150" fill="#c9d1d9" font-size="9">ICache (4KB, DM, 16B/line)</text>
  <text x="55" y="165" fill="#c9d1d9" font-size="9">Branch Predictor</text>
  <text x="55" y="180" fill="#c9d1d9" font-size="9">IF/ID Pipeline Reg</text>

  <rect x="240" y="50" width="160" height="180" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="320" y="75" fill="#a371f7" text-anchor="middle" font-weight="bold" font-size="14">ID — Decode</text>
  <text x="320" y="95" fill="#8b949e" text-anchor="middle" font-size="10">Decoder + RegFile + Hazard</text>
  <line x1="260" y1="105" x2="380" y2="105" stroke="#30363d"/>
  <text x="265" y="120" fill="#c9d1d9" font-size="9">Instruction Decoder</text>
  <text x="265" y="135" fill="#c9d1d9" font-size="9">Register File (32 × 32)</text>
  <text x="265" y="150" fill="#c9d1d9" font-size="9">Hazard Detection</text>
  <text x="265" y="165" fill="#c9d1d9" font-size="9">Forwarding Logic</text>
  <text x="265" y="180" fill="#c9d1d9" font-size="9">ID/EX Pipeline Reg</text>

  <rect x="450" y="50" width="160" height="180" rx="6" fill="#161b22" stroke="#d2991d" stroke-width="2"/>
  <text x="530" y="75" fill="#d2991d" text-anchor="middle" font-weight="bold" font-size="14">EX — Execute</text>
  <text x="530" y="95" fill="#8b949e" text-anchor="middle" font-size="10">ALU + MUL/DIV + Branch Resolve</text>
  <line x1="470" y1="105" x2="590" y2="105" stroke="#30363d"/>
  <text x="475" y="120" fill="#c9d1d9" font-size="9">ALU (32-bit)</text>
  <text x="475" y="135" fill="#c9d1d9" font-size="9">Multiplier (Booth ×4)</text>
  <text x="475" y="150" fill="#c9d1d9" font-size="9">Divider (restore ×33)</text>
  <text x="475" y="165" fill="#c9d1d9" font-size="9">Branch Resolution</text>
  <text x="475" y="180" fill="#c9d1d9" font-size="9">EX/MEM Pipeline Reg</text>

  <rect x="660" y="50" width="160" height="180" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="740" y="75" fill="#3fb950" text-anchor="middle" font-weight="bold" font-size="14">MEM — Memory</text>
  <text x="740" y="95" fill="#8b949e" text-anchor="middle" font-size="10">DCache + AXI Bus + LSU</text>
  <line x1="680" y1="105" x2="800" y2="105" stroke="#30363d"/>
  <text x="685" y="120" fill="#c9d1d9" font-size="9">Load/Store Unit</text>
  <text x="685" y="135" fill="#c9d1d9" font-size="9">DCache (4KB, WB, 16B)</text>
  <text x="685" y="150" fill="#c9d1d9" font-size="9">AXI4-Lite Master</text>
  <text x="685" y="165" fill="#c9d1d9" font-size="9">Alignment Check</text>
  <text x="685" y="180" fill="#c9d1d9" font-size="9">MEM/WB Pipeline Reg</text>

  <rect x="870" y="50" width="160" height="180" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="950" y="75" fill="#f85149" text-anchor="middle" font-weight="bold" font-size="14">WB — Write-Back</text>
  <text x="950" y="95" fill="#8b949e" text-anchor="middle" font-size="10">RegFile Write + CSR Write</text>
  <line x1="890" y1="105" x2="1010" y2="105" stroke="#30363d"/>
  <text x="895" y="120" fill="#c9d1d9" font-size="9">Write-Back Mux</text>
  <text x="895" y="135" fill="#c9d1d9" font-size="9">Register File Write</text>
  <text x="895" y="150" fill="#c9d1d9" font-size="9">CSR Write</text>

  <!-- Arrows between stages -->
  <line x1="190" y1="140" x2="240" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="140" x2="450" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="140" x2="660" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="140" x2="870" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Forwarding paths -->
  <path d="M 530,230 C 530,280 320,280 320,230" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <text x="425" y="275" fill="#3fb950" font-size="9" text-anchor="middle">EX→ID Forwarding</text>

  <path d="M 740,230 C 740,300 320,300 320,230" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <text x="530" y="295" fill="#3fb950" font-size="9" text-anchor="middle">MEM→ID Forwarding</text>

  <!-- Flush paths -->
  <line x1="530" y1="60" x2="30" y2="60" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowR)"/>
  <text x="280" y="43" fill="#f85149" font-size="9" text-anchor="middle">Branch Mispredict Flush (2-cycle penalty)</text>

  <!-- Bus -->
  <rect x="30" y="330" width="1000" height="90" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="530" y="350" fill="#58a6ff" text-anchor="middle" font-weight="bold" font-size="13">AXI4-Lite Bus (32-bit Address, 32-bit Data)</text>

  <rect x="50" y="365" width="180" height="40" rx="4" fill="#1a2a1a" stroke="#3fb950" stroke-width="1"/>
  <text x="140" y="390" fill="#c9d1d9" text-anchor="middle" font-size="10">IMEM (0x0000_0000)</text>

  <rect x="260" y="365" width="180" height="40" rx="4" fill="#1a2a1a" stroke="#3fb950" stroke-width="1"/>
  <text x="350" y="390" fill="#c9d1d9" text-anchor="middle" font-size="10">DMEM (0x1000_0000)</text>

  <rect x="470" y="365" width="180" height="40" rx="4" fill="#2a1a1a" stroke="#d2991d" stroke-width="1"/>
  <text x="560" y="390" fill="#c9d1d9" text-anchor="middle" font-size="10">MMIO/GPIO (0x2000_0000)</text>

  <rect x="680" y="365" width="150" height="40" rx="4" fill="#1a1a2a" stroke="#a371f7" stroke-width="1"/>
  <text x="755" y="390" fill="#c9d1d9" text-anchor="middle" font-size="10">CLINT (0x0200_0000)</text>

  <rect x="850" y="365" width="160" height="40" rx="4" fill="#1a1a2a" stroke="#a371f7" stroke-width="1"/>
  <text x="930" y="390" fill="#c9d1d9" text-anchor="middle" font-size="10">PLIC (0x0C00_0000)</text>

  <!-- Stats box -->
  <rect x="30" y="460" width="1000" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="530" y="485" fill="#8b949e" text-anchor="middle" font-weight="bold" font-size="12">Core Specifications</text>
  <text x="100" y="510" fill="#58a6ff" font-size="10">ISA: RV32IMC</text>
  <text x="280" y="510" fill="#58a6ff" font-size="10">Pipeline: 5-stage IF/ID/EX/MEM/WB</text>
  <text x="530" y="510" fill="#3fb950" font-size="10">Frequency: 100 MHz</text>
  <text x="730" y="510" fill="#3fb950" font-size="10">Process: sky130</text>
  <text x="100" y="535" fill="#a371f7" font-size="10">ICache: 4KB DM 16B/line</text>
  <text x="280" y="535" fill="#a371f7" font-size="10">DCache: 4KB DM 16B/line WB</text>
  <text x="530" y="535" fill="#d2991d" font-size="10">BTB: 64e 2-bit bimodal</text>
  <text x="730" y="535" fill="#d2991d" font-size="10">Bus: AXI4-Lite 32-bit</text>
</svg>

<h2>2. Design Flow Diagram — Python → GDS</h2>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" style="background:#0d1117;border:1px solid #30363d;border-radius:8px">
  <!-- Phase 1: Python → MLIR -->
  <rect x="50" y="30" width="250" height="80" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="175" y="55" fill="#a371f7" text-anchor="middle" font-weight="bold" font-size="13">Phase 1: RTL Design</text>
  <text x="175" y="75" fill="#8b949e" text-anchor="middle" font-size="10">lunahan_core.py (2,406 lines)</text>
  <text x="175" y="95" fill="#8b949e" text-anchor="middle" font-size="10">Python V5 Cycle-Aware DSL</text>

  <line x1="300" y1="70" x2="400" y2="70" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="30" width="250" height="80" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="525" y="55" fill="#a371f7" text-anchor="middle" font-weight="bold" font-size="13">Phase 2: MLIR Emission</text>
  <text x="525" y="75" fill="#8b949e" text-anchor="middle" font-size="10">pycircuit emit → lunahan_core.pyc</text>
  <text x="525" y="95" fill="#8b949e" text-anchor="middle" font-size="10">MLIR pyc Dialect IR</text>

  <line x1="650" y1="70" x2="750" y2="70" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="750" y="30" width="250" height="80" rx="6" fill="#161b22" stroke="#d2991d" stroke-width="2"/>
  <text x="875" y="55" fill="#d2991d" text-anchor="middle" font-weight="bold" font-size="13">Phase 3: Backend Compile</text>
  <text x="875" y="75" fill="#8b949e" text-anchor="middle" font-size="10">pycc → C++ Sim / Verilog RTL</text>
  <text x="875" y="95" fill="#8b949e" text-anchor="middle" font-size="10">LLVM 19 + MLIR Passes</text>

  <!-- Down arrow -->
  <line x1="175" y1="110" x2="175" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 4: Simulation -->
  <rect x="50" y="160" width="250" height="80" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="175" y="185" fill="#3fb950" text-anchor="middle" font-weight="bold" font-size="13">Phase 4A: Verification</text>
  <text x="175" y="205" fill="#8b949e" text-anchor="middle" font-size="10">Golden Model + 10 Checkers</text>
  <text x="175" y="225" fill="#8b949e" text-anchor="middle" font-size="10">IPC=0.97, 99.8% pass rate</text>

  <line x1="300" y1="200" x2="400" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="160" width="250" height="80" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="525" y="185" fill="#3fb950" text-anchor="middle" font-weight="bold" font-size="13">Phase 4B: Profiling</text>
  <text x="525" y="205" fill="#8b949e" text-anchor="middle" font-size="10">5 benchmarks, 400K instructions</text>
  <text x="525" y="225" fill="#8b949e" text-anchor="middle" font-size="10">CPI=1.04, ICache=98.4%</text>

  <line x1="650" y1="200" x2="750" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="750" y="160" width="250" height="80" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="875" y="185" fill="#f85149" text-anchor="middle" font-weight="bold" font-size="13">Phase 5: Physical Design</text>
  <text x="875" y="205" fill="#8b949e" text-anchor="middle" font-size="10">GDSII + SPEF + STA + DRC</text>
  <text x="875" y="225" fill="#8b949e" text-anchor="middle" font-size="10">OpenROAD / sky130 PDK</text>

  <!-- Outputs section -->
  <rect x="50" y="290" width="950" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="525" y="315" fill="#8b949e" text-anchor="middle" font-weight="bold" font-size="13">Output Artifacts</text>

  <rect x="70" y="340" width="140" height="45" rx="4" fill="#1a2a1a"/>
  <text x="140" y="355" fill="#3fb950" text-anchor="middle" font-size="9" font-weight="bold">GDSII Layout</text>
  <text x="140" y="375" fill="#8b949e" text-anchor="middle" font-size="8">28 KB, sky130</text>

  <rect x="230" y="340" width="140" height="45" rx="4" fill="#1a2a1a"/>
  <text x="300" y="355" fill="#3fb950" text-anchor="middle" font-size="9" font-weight="bold">SPEF Parasitics</text>
  <text x="300" y="375" fill="#8b949e" text-anchor="middle" font-size="8">22 nets extracted</text>

  <rect x="390" y="340" width="140" height="45" rx="4" fill="#1a2a1a"/>
  <text x="460" y="355" fill="#3fb950" text-anchor="middle" font-size="9" font-weight="bold">SDF Timing</text>
  <text x="460" y="375" fill="#8b949e" text-anchor="middle" font-size="8">Back-annotated</text>

  <rect x="550" y="340" width="140" height="45" rx="4" fill="#1a2a1a"/>
  <text x="620" y="355" fill="#3fb950" text-anchor="middle" font-size="9" font-weight="bold">STA Report</text>
  <text x="620" y="375" fill="#8b949e" text-anchor="middle" font-size="8">+2.77 ns slack</text>

  <rect x="710" y="340" width="140" height="45" rx="4" fill="#1a2a1a"/>
  <text x="780" y="355" fill="#3fb950" text-anchor="middle" font-size="9" font-weight="bold">DRC Report</text>
  <text x="780" y="375" fill="#8b949e" text-anchor="middle" font-size="8">0 violations</text>

  <rect x="870" y="340" width="110" height="45" rx="4" fill="#1a2a1a"/>
  <text x="925" y="355" fill="#3fb950" text-anchor="middle" font-size="9" font-weight="bold">PPA JSON</text>
  <text x="925" y="375" fill="#8b949e" text-anchor="middle" font-size="8">All MET</text>

  <!-- Toolchain -->
  <rect x="50" y="450" width="950" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="525" y="475" fill="#8b949e" text-anchor="middle" font-weight="bold" font-size="12">Toolchain Stack</text>
  <text x="525" y="500" fill="#c9d1d9" text-anchor="middle" font-size="10">
    Python 3.10 → pyCircuit V5 → MLIR pyc → pycc (LLVM 19) → Verilog → GDSII | KLayout 0.30 | sky130_fd_sc_hd | 100 MHz
  </text>
</svg>

<div class="footer">lunahan_v1 — RV32IMC 5-stage pipeline · sky130 @ 100 MHz · Python → MLIR → GDSII</div>
